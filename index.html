<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="CUPRA RAVAL"/>
  <link rel="manifest" href="manifest.json"/>
  <title>CUPRA RAVAL</title>
  <style>
    @font-face {
      font-family: 'Cupra';
      src: url('./Cupra-Regular.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      font-family: 'Cupra', sans-serif;
      color: #fff; -webkit-tap-highlight-color: transparent;
    }

    /* ═══ CAMERA ═══ */
    #qr-reader {
      position: fixed; inset: 0;
      width: 100% !important; height: 100% !important;
      overflow: hidden; border: none !important;
    }
    #qr-reader video {
      position: absolute !important; inset: 0 !important;
      width: 100% !important; height: 100% !important;
      object-fit: cover !important;
    }
    #qr-reader img, #qr-reader button, #qr-reader select,
    #qr-reader br, #qr-reader p, #qr-reader span:not(.dot),
    #qr-reader #qr-reader__status_span,
    #qr-reader #qr-reader__header_message,
    #qr-reader #qr-reader__dashboard,
    #qr-reader #qr-reader__filescan_input,
    #qr-reader #qr-reader__camera_selection { display: none !important; }
    #qr-reader canvas { opacity: 0; position: absolute; pointer-events: none; }
    #qr-reader__scan_region > div { display: none !important; }

    /* ═══ UI LAYER ═══ */
    #ui {
      position: fixed; inset: 0; pointer-events: none; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #ui::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,.78) 100%);
    }

    /* Top bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding-top: max(34px, env(safe-area-inset-top, 34px));
      padding-bottom: 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,.9) 55%, transparent);
      pointer-events: auto;
    }
    .logo-main {
      width: min(52vw, 160px);
      height: auto;
      display: block;
    }

    /* Scan frame */
    #sf {
      position: relative; z-index: 1;
      width: min(54vw, 54vh); height: min(54vw, 54vh);
    }
    #sf::before, #sf::after, .cb, .cc {
      content: ''; position: absolute;
      width: 32px; height: 32px;
      border-style: solid; border-color: rgba(255,255,255,.8);
      transition: border-color .18s;
    }
    #sf::before { top: 0; left: 0;  border-width: 2px 0 0 2px; }
    #sf::after  { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .cb { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
    .cc { bottom: 0; left: 0;  border-width: 0 0 2px 2px; }

    .laser {
      position: absolute; left: 5px; right: 5px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.9), transparent);
      box-shadow: 0 0 5px rgba(255,255,255,.7), 0 0 12px rgba(255,255,255,.3);
      animation: scan 2.2s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { top: 5px; opacity: 1; }
      48%       { top: calc(100% - 6px); opacity: 1; }
      50%       { top: calc(100% - 6px); opacity: .15; }
    }
    #sf.ok::before, #sf.ok::after, #sf.ok .cb, #sf.ok .cc { border-color: #fff; }
    #sf.ok { animation: glow .4s ease-out; }
    @keyframes glow {
      40%  { filter: drop-shadow(0 0 14px rgba(255,255,255,.85)); }
      100% { filter: none; }
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 22px 24px max(30px, env(safe-area-inset-bottom, 30px));
      background: linear-gradient(to top, rgba(0,0,0,.9) 55%, transparent);
      pointer-events: auto;
    }
    .bottom-bar p {
      font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
      opacity: .42; text-align: center;
    }
    #status {
      font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
      padding: 7px 24px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.16);
      display: flex; align-items: center; gap: 9px;
      transition: all .3s;
    }
    #status.ok  { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.55); }
    #status.err { background: rgba(220,60,60,.1); border-color: rgba(220,60,60,.5); color: #f87171; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      background: #fff; box-shadow: 0 0 5px #fff;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .2; transform: scale(.5); }
    }

    /* ═══ PDF OVERLAY ═══ */
    #pdf-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #000; flex-direction: column;
    }
    #pdf-overlay.open { display: flex; animation: fi .2s ease; }
    @keyframes fi { from { opacity: 0; } to { opacity: 1; } }

    .pdf-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top, 14px)) 18px 14px;
      background: #000; border-bottom: 1px solid rgba(255,255,255,.1);
      flex-shrink: 0; min-height: 58px;
    }
    .hd-brand { display: flex; align-items: center; }
    .hd-logo { height: 28px; width: auto; opacity: .85; }

    #close-btn {
      width: 44px; height: 44px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent; color: #fff; font-size: .95rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    #close-btn:active { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.5); }

    #pdf-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: #111;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    }
    .pdf-page-canvas { display: block; max-width: 100%; }

    #loader {
      position: absolute; top: 58px; bottom: 0; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #000; z-index: 5; transition: opacity .3s;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .spin {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.08);
      border-top-color: rgba(255,255,255,.7);
      animation: sp .7s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    #loader p { font-size: .63rem; letter-spacing: .16em; text-transform: uppercase; opacity: .38; }

    #fallback {
      display: none; position: absolute;
      top: 58px; bottom: 0; left: 0; right: 0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 40px; text-align: center; background: #000;
    }
    #fallback.show { display: flex; }
    #fallback h3 { font-size: .82rem; letter-spacing: .22em; text-transform: uppercase; }
    #fallback p { font-size: .66rem; letter-spacing: .08em; opacity: .4; line-height: 1.9; max-width: 300px; }
    #open-btn {
      padding: 13px 44px;
      border: 1px solid rgba(255,255,255,.35);
      background: transparent; color: #fff;
      font-family: 'Cupra', sans-serif;
      font-size: .68rem; letter-spacing: .22em; text-transform: uppercase;
      cursor: pointer; text-decoration: none; display: inline-block;
      transition: background .15s, border-color .15s;
    }
    #open-btn:active { background: rgba(255,255,255,.08); border-color: #fff; }
  </style>
</head>
<body>

<!-- Camera layer -->
<div id="qr-reader"></div>

<!-- UI overlay -->
<div id="ui">
  <div class="top-bar">
    <img class="logo-main" src="./logo-cropped.png" alt="Cupra Raval"/>
  </div>

  <div id="sf">
    <div class="cb"></div>
    <div class="cc"></div>
    <div class="laser"></div>
  </div>

  <div class="bottom-bar">
    <p>Point camera at one of the 8 QR codes</p>
    <div id="status"><span class="dot"></span>Scanning…</div>
  </div>
</div>

<!-- PDF overlay -->
<div id="pdf-overlay">
  <div class="pdf-header">
    <div class="hd-brand">
      <img class="hd-logo" src="./logo-cropped.png" alt="Cupra Raval"/>
    </div>
    <button id="close-btn">&#x2715;</button>
  </div>
  <div id="loader"><div class="spin"></div><p>Loading document…</p></div>
  <div id="pdf-scroll"></div>
  <div id="fallback">
    <h3>Document Unavailable</h3>
    <p>This file cannot be loaded directly.<br/>Open it in your browser instead.</p>
    <a id="open-btn" target="_blank" rel="noopener noreferrer">Open Document</a>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var sf        = document.getElementById('sf');
  var statusEl  = document.getElementById('status');
  var overlay   = document.getElementById('pdf-overlay');
  var pdfScroll = document.getElementById('pdf-scroll');
  var loader    = document.getElementById('loader');
  var fallback  = document.getElementById('fallback');
  var openBtn   = document.getElementById('open-btn');
  var closeBtn  = document.getElementById('close-btn');

  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').catch(function(){});

  var lastUrl = '', lastTime = 0, pdfTask = null;
  var COOLDOWN = 3500;

  function normalizeUrl(href) {
    var m = href.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/);
    if (m) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + m[4];
    return href;
  }

  var scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 15, qrbox: { width: 240, height: 240 },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      rememberLastUsedCamera: true },
    onDetected,
    function() {}
  )
  .then(function() { setStatus('<span class="dot"></span>Scanning&hellip;', ''); })
  .catch(function() { setStatus('Camera access denied', 'err'); });

  function onDetected(raw) {
    var now = Date.now();
    if (raw === lastUrl && now - lastTime < COOLDOWN) return;
    lastUrl = raw; lastTime = now;

    var url;
    try {
      var u = new URL(raw.trim());
      if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
      url = normalizeUrl(u.href);
    } catch(e) {
      setStatus('Invalid QR &mdash; no URL found', 'err');
      setTimeout(function() { setStatus('<span class="dot"></span>Scanning&hellip;', ''); }, 2000);
      return;
    }

    sf.classList.remove('ok');
    void sf.offsetWidth;
    sf.classList.add('ok');
    setTimeout(function() { sf.classList.remove('ok'); }, 500);
    if (navigator.vibrate) navigator.vibrate(70);

    setStatus('QR detected &mdash; loading&hellip;', 'ok');
    openPDF(url);
  }

  function openPDF(url) {
    loader.classList.remove('hide');
    fallback.classList.remove('show');
    pdfScroll.innerHTML = '';
    openBtn.href = url;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    if (pdfTask) { try { pdfTask.destroy(); } catch(e) {} pdfTask = null; }

    pdfTask = pdfjsLib.getDocument({
      url: url,
      withCredentials: false,
      cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
      cMapPacked: true,
    });

    pdfTask.promise.then(function(pdf) {
      loader.classList.add('hide');
      var containerW = pdfScroll.clientWidth || window.innerWidth;
      var pagePromise = Promise.resolve();
      for (var i = 1; i <= pdf.numPages; i++) {
        (function(pageNum) {
          pagePromise = pagePromise.then(function() {
            return pdf.getPage(pageNum).then(function(page) {
              var viewport = page.getViewport({ scale: 1 });
              var scale    = (containerW - 8) / viewport.width;
              var scaled   = page.getViewport({ scale: scale });
              var canvas   = document.createElement('canvas');
              canvas.className = 'pdf-page-canvas';
              canvas.width     = scaled.width;
              canvas.height    = scaled.height;
              pdfScroll.appendChild(canvas);
              return page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;
            });
          });
        })(i);
      }
      return pagePromise;
    }).catch(function(err) {
      console.error('PDF error:', err);
      loader.classList.add('hide');
      fallback.classList.add('show');
    });
  }

  function closePDF() {
    overlay.classList.remove('open');
    if (pdfTask) { try { pdfTask.destroy(); } catch(e) {} pdfTask = null; }
    pdfScroll.innerHTML = '';
    document.body.style.overflow = '';
    lastTime = Date.now();
    setStatus('<span class="dot"></span>Scanning&hellip;', '');
  }

  closeBtn.addEventListener('click', closePDF);

  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = cls;
  }
</script>
</body>
</html>
