<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR PDF" />
  <link rel="manifest" href="manifest.json" />
  <title>QR Scanner PDF</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6c63ff;
      --accent2: #ff6584;
      --bg: #0f0f1a;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── SCANNER WRAPPER ─── */
    #scanner-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* html5-qrcode mounts a video+canvas here */
    #qr-reader {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* hide the default html5-qrcode UI chrome */
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #qr-reader img,
    #qr-reader button,
    #qr-reader select,
    #qr-reader span,
    #qr-reader div > br { display: none !important; }
    #qr-reader > div[style] { display: none !important; }

    /* dark vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 38%, rgba(0,0,0,0.68) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* top bar */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      padding: max(44px, env(safe-area-inset-top, 44px)) 24px 18px;
      background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
      z-index: 10;
    }
    .top-bar h1 {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
    }

    /* scan frame */
    .scan-frame {
      position: relative;
      width: min(62vw, 62vh);
      height: min(62vw, 62vh);
      z-index: 10;
    }
    .scan-frame::before, .scan-frame::after,
    .c-br, .c-bl {
      content: '';
      position: absolute;
      width: 38px; height: 38px;
      border-color: rgba(255,255,255,.9);
      border-style: solid;
      transition: border-color .2s;
    }
    .scan-frame::before { top:0;    left:0;  border-width:3px 0 0 3px; border-radius:6px 0 0 0; }
    .scan-frame::after  { top:0;    right:0; border-width:3px 3px 0 0; border-radius:0 6px 0 0; }
    .c-br               { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 6px 0; }
    .c-bl               { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 6px; }

    .laser {
      position: absolute;
      left:6px; right:6px; height:2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      box-shadow: 0 0 8px var(--accent), 0 0 18px var(--accent);
      border-radius:2px;
      animation: scan 2.2s ease-in-out infinite;
      top:6px;
    }
    @keyframes scan {
      0%,100% { top:6px; opacity:1; }
      48%     { top:calc(100% - 8px); opacity:1; }
      50%     { top:calc(100% - 8px); opacity:.3; }
    }

    /* flash on detect */
    .scan-frame.ok .c-br,
    .scan-frame.ok .c-bl,
    .scan-frame.ok::before,
    .scan-frame.ok::after { border-color:#4ade80; }
    .scan-frame.ok { animation: glow .4s ease-out; }
    @keyframes glow {
      0%   { filter:drop-shadow(0 0 0 transparent); }
      40%  { filter:drop-shadow(0 0 20px #4ade80); }
      100% { filter:drop-shadow(0 0 0 transparent); }
    }

    /* bottom bar */
    .bottom-bar {
      position: absolute;
      bottom:0; left:0; right:0;
      display:flex; flex-direction:column;
      align-items:center; gap:10px;
      padding: 18px 24px max(32px, env(safe-area-inset-bottom, 32px));
      background: linear-gradient(to top, rgba(0,0,0,.65), transparent);
      z-index: 10;
    }
    .bottom-bar p { font-size:.9rem; opacity:.65; text-align:center; }

    #status {
      font-size:.82rem; font-weight:500;
      padding:6px 18px; border-radius:20px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.12);
      display:flex; align-items:center; gap:8px;
      min-height:32px; transition:all .3s;
    }
    #status.ok  { background:rgba(74,222,128,.15); border-color:rgba(74,222,128,.4); color:#4ade80; }
    #status.err { background:rgba(255,101,132,.15); border-color:rgba(255,101,132,.4); color:var(--accent2); }

    .dot {
      width:9px; height:9px; border-radius:50%;
      background:#4ade80; box-shadow:0 0 7px #4ade80;
      animation:pdot 1.1s ease-in-out infinite; flex-shrink:0;
    }
    @keyframes pdot {
      0%,100% { opacity:1; transform:scale(1); }
      50%     { opacity:.3; transform:scale(.65); }
    }

    /* ─── PDF OVERLAY ─── */
    #pdf-overlay {
      display:none; position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.94);
      backdrop-filter:blur(6px);
      flex-direction:column;
    }
    #pdf-overlay.open { display:flex; animation:fadeUp .25s ease; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    #close-btn {
      position:absolute;
      top: max(18px, env(safe-area-inset-top, 18px));
      right:18px; z-index:10;
      width:52px; height:52px; border-radius:50%;
      border:1.5px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.1);
      backdrop-filter:blur(10px);
      color:#fff; font-size:1.3rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .2s, transform .15s;
    }
    #close-btn:active { transform:scale(.88); }

    #pdf-wrap {
      flex:1; display:flex; flex-direction:column;
      padding: max(82px, calc(env(safe-area-inset-top,0px)+82px)) 0
               max(18px, env(safe-area-inset-bottom,18px));
    }

    #pdf-frame {
      flex:1; width:100%; border:none; background:#fff;
    }

    /* spinner */
    #loader {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:5; transition:opacity .3s;
    }
    #loader.hide { opacity:0; pointer-events:none; }
    .spin {
      width:48px; height:48px;
      border:4px solid rgba(255,255,255,.12);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:sp .75s linear infinite;
    }
    @keyframes sp { to { transform:rotate(360deg); } }

    /* fallback */
    #fallback {
      display:none; flex:1;
      flex-direction:column; align-items:center; justify-content:center;
      gap:18px; padding:40px; text-align:center;
    }
    #fallback.show { display:flex; }
    #fallback h3 { font-size:1.3rem; font-weight:600; }
    #fallback p  { opacity:.6; line-height:1.6; max-width:340px; }
    #open-btn {
      padding:13px 36px; border-radius:50px; border:none;
      background:var(--accent); color:#fff;
      font-size:1rem; font-weight:600;
      cursor:pointer; text-decoration:none;
    }
  </style>
</head>
<body>

<!-- ─── SCANNER ─── -->
<div id="scanner-wrap">
  <div id="qr-reader"></div>
  <div class="vignette"></div>

  <div class="top-bar"><h1>Escáner QR</h1></div>

  <div class="scan-frame" id="sf">
    <div class="c-br"></div>
    <div class="c-bl"></div>
    <div class="laser"></div>
  </div>

  <div class="bottom-bar">
    <p>Apunta la cámara a uno de los 8 códigos QR</p>
    <div id="status"><span class="dot"></span>Iniciando cámara…</div>
  </div>
</div>

<!-- ─── PDF OVERLAY ─── -->
<div id="pdf-overlay">
  <button id="close-btn" aria-label="Cerrar">✕</button>
  <div id="loader"><div class="spin"></div></div>
  <div id="pdf-wrap">
    <iframe id="pdf-frame" title="PDF"></iframe>
    <div id="fallback">
      <div style="font-size:3.5rem">📄</div>
      <h3>No se puede embeber</h3>
      <p>Este PDF no permite mostrarse en la app. Ábrelo directamente.</p>
      <a id="open-btn" target="_blank" rel="noopener">Abrir PDF</a>
    </div>
  </div>
</div>

<!-- html5-qrcode: battle-tested scanner library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  const sf        = document.getElementById('sf');
  const statusEl  = document.getElementById('status');
  const overlay   = document.getElementById('pdf-overlay');
  const frame     = document.getElementById('pdf-frame');
  const loader    = document.getElementById('loader');
  const fallback  = document.getElementById('fallback');
  const openBtn   = document.getElementById('open-btn');
  const closeBtn  = document.getElementById('close-btn');

  // ── PWA ──
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').catch(() => {});

  // ── Cooldown ──
  let lastUrl = '';
  let lastTime = 0;
  const COOLDOWN = 3500;

  // ── html5-qrcode scanner ──
  const scanner = new Html5Qrcode('qr-reader');

  const config = {
    fps: 15,
    qrbox: { width: 280, height: 280 },   // detection zone (hidden visually, we draw our own)
    aspectRatio: window.innerHeight / window.innerWidth,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    rememberLastUsedCamera: true,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
  };

  scanner.start(
    { facingMode: 'environment' },
    config,
    onScanSuccess,
    () => {}   // ignore per-frame errors silently
  ).then(() => {
    setStatus('<span class="dot"></span>Buscando código QR…', '');
  }).catch(err => {
    console.error(err);
    setStatus('⚠️ Sin acceso a la cámara', 'err');
  });

  function onScanSuccess(url) {
    const now = Date.now();
    if (url === lastUrl && now - lastTime < COOLDOWN) return;
    lastUrl  = url;
    lastTime = now;

    // Validate URL
    let clean;
    try {
      const u = new URL(url.trim());
      if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
      clean = u.href;
    } catch {
      setStatus('QR sin URL válida', 'err');
      setTimeout(() => setStatus('<span class="dot"></span>Buscando…', ''), 2000);
      return;
    }

    // Visual feedback
    sf.classList.add('ok');
    setTimeout(() => sf.classList.remove('ok'), 500);
    if (navigator.vibrate) navigator.vibrate(70);

    setStatus('✓ QR detectado', 'ok');
    openPDF(clean);
  }

  // ── PDF Overlay ──
  function openPDF(url) {
    fallback.classList.remove('show');
    frame.style.display = 'block';
    loader.classList.remove('hide');
    frame.src = '';
    openBtn.href = url;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Wrap cross-origin PDFs in Google Docs viewer
    const embedUrl = url.startsWith(location.origin)
      ? url
      : `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;

    frame.onload  = () => loader.classList.add('hide');
    frame.onerror = () => showFallback(url);
    frame.src = embedUrl;

    const t = setTimeout(() => {
      if (!loader.classList.contains('hide')) showFallback(url);
    }, 15000);
    frame.addEventListener('load', () => clearTimeout(t), { once: true });
  }

  function showFallback(url) {
    loader.classList.add('hide');
    frame.style.display = 'none';
    fallback.classList.add('show');
    openBtn.href = url;
  }

  function closePDF() {
    overlay.classList.remove('open');
    frame.src = '';
    document.body.style.overflow = '';
    lastTime = Date.now();
    setStatus('<span class="dot"></span>Listo para escanear', '');
  }

  closeBtn.addEventListener('click', closePDF);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePDF(); });

  // ── Status ──
  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = cls;
  }
</script>
</body>
</html>
